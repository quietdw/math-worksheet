<style>
  main{flex:1 1 auto;padding:32px 0 44px}
  .home{width:100%;max-width:1000px;margin:0 auto;padding:0 24px}

  .home-lead{margin:8px 0 26px;color:var(--muted);font-size:14px}

  .cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  .card{
    display:flex;
    flex-direction:column;
    gap:10px;
    position:relative;
    padding:20px 20px 18px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.04);
    color:inherit;
    text-decoration:none;
    transition:border-color .15s,transform .15s;
  }
  a.card:hover{border-color:var(--tone);transform:translateY(-2px)}
  a.card:focus-visible{outline:2px solid var(--tone);outline-offset:2px}
  .card::before{
    content:"";
    position:absolute;
    inset:0 auto 0 0;
    width:3px;
    border-radius:10px 0 0 10px;
    background:var(--tone);
  }
  .card[data-subject="math"]{--tone:#2563eb}
  .card[data-subject="chinese"]{--tone:#b4451f}
  .card[data-subject="english"]{--tone:#157347}
  html[data-theme="dark"] .card[data-subject="math"]{--tone:#6b95ff}
  html[data-theme="dark"] .card[data-subject="chinese"]{--tone:#e0885f}
  html[data-theme="dark"] .card[data-subject="english"]{--tone:#5cc08d}

  .card-head{display:flex;align-items:center;gap:8px}
  .card h2{margin:0;font-size:17px;font-weight:600}
  .tag{
    margin-left:auto;
    padding:1px 7px;
    border:1px solid var(--line);
    border-radius:999px;
    background:var(--line-soft);
    color:var(--muted);
    font-size:11px;
    line-height:1.7;
    white-space:nowrap;
  }
  .tag.live{border-color:transparent;background:var(--accent-soft);color:var(--accent)}
  .card p{margin:0;color:var(--muted);font-size:13px}
  .card ul{margin:2px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
  .card li{padding:2px 8px;border:1px solid var(--line-soft);border-radius:4px;font-size:12px}
  .card .go{margin-top:auto;padding-top:6px;color:var(--tone);font-size:13px;font-weight:600}
  .card.pending .go{color:var(--muted);font-weight:500}

  @media (max-width:900px){
    .cards{grid-template-columns:1fr}
    main{padding:22px 0 32px}
    .home h1{font-size:20px}
  }
</style>
