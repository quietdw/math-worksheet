<noscript>
  <div class="noscript-note">
    <h1>语文练习卷生成器</h1>
    <p>本工具需要启用 JavaScript 才能生成题目。开启后可按年级与难度星级生成看拼音写词语、生字注音、同音字选字与组词练习，并在浏览器中排版打印。</p>

<div class="app">
  <main class="preview" id="preview">
    <div class="zoom-bar">
      <div class="sheet-title">
        <h1 data-shell="cnAppTitle">语文练习卷生成器</h1>
        <p data-shell="cnAppSubtitle">按年级与星级出题 · 看拼音写词语 / 注音 / 选字 / 组词</p>
      </div>
      <div class="zoom-inner">
        <button type="button" class="zoom-btn" id="zoomOut" aria-label="缩小">−</button>
        <button type="button" class="zoom-val" id="zoomVal" aria-label="重置缩放">100%</button>
        <button type="button" class="zoom-btn" id="zoomIn" aria-label="放大">+</button>
        <span class="zoom-sep"></span>
        <button type="button" class="zoom-btn wide" id="zoomFit">适应宽度</button>
      </div>
    </div>
    <div class="paper-wrap">
      <div id="paper"></div>
    </div>
  </main>

  <aside class="panel">
    <div class="panel-head">
      <span data-shell="cnPanelTitle">参数设置</span>
      <button type="button" class="link-btn" id="resetBtn" data-shell="cnReset">重置</button>
    </div>

    <div class="panel-scroll">
      <div class="group-title" data-shell="cnGroupContent">题目内容</div>

      <div class="field">
        <div class="field-label" data-shell="cnGrades">年级</div>
        <div class="chips">
          <button type="button" class="chip" data-key="grades" data-value="1" data-multi="true" data-shell="g1">一年级</button>
          <button type="button" class="chip" data-key="grades" data-value="2" data-multi="true" data-shell="g2">二年级</button>
          <button type="button" class="chip" data-key="grades" data-value="3" data-multi="true" data-shell="g3">三年级</button>
          <button type="button" class="chip" data-key="grades" data-value="4" data-multi="true" data-shell="g4">四年级</button>
          <button type="button" class="chip" data-key="grades" data-value="5" data-multi="true" data-shell="g5">五年级</button>
          <button type="button" class="chip" data-key="grades" data-value="6" data-multi="true" data-shell="g6">六年级</button>
        </div>
      </div>

      <div class="field">
        <div class="field-label" data-shell="cnTypes">题型</div>
        <div class="chips">
          <button type="button" class="chip" data-key="types" data-value="pinyin2word" data-multi="true" data-shell="cnTypePinyin2word">看拼音写词语</button>
          <button type="button" class="chip" data-key="types" data-value="char2pinyin" data-multi="true" data-shell="cnTypeChar2pinyin">生字注音</button>
          <button type="button" class="chip" data-key="types" data-value="homophone" data-multi="true" data-shell="cnTypeHomophone">同音字选字</button>
          <button type="button" class="chip" data-key="types" data-value="wordBuild" data-multi="true" data-shell="cnTypeWordBuild">组词</button>
        </div>
      </div>

      <div class="field">
        <div class="field-head">
          <span class="field-label" data-shell="cnCount">题目数量</span>
          <div class="chips" id="countPresets">
            <button type="button" class="chip mini" data-count="20">20</button>
            <button type="button" class="chip mini" data-count="50">50</button>
            <button type="button" class="chip mini" data-count="100">100</button>
          </div>
        </div>
        <div class="inline">
          <input type="number" id="countInput" min="1" max="200" step="1" value="20" aria-label="题目数量">
          <span class="hint" data-shell="cnCountHint">1–200</span>
        </div>
      </div>

      <div class="group-title" data-shell="cnGroupLevel">难度</div>

      <div class="field">
        <div class="field-head">
          <span class="field-label" data-shell="cnStars">星级</span>
          <span class="hint" data-shell="cnStarsHint">★1 最易，★3 最难</span>
        </div>
        <div class="chips">
          <button type="button" class="chip" data-key="stars" data-value="1" data-multi="true">★1</button>
          <button type="button" class="chip" data-key="stars" data-value="2" data-multi="true">★2</button>
          <button type="button" class="chip" data-key="stars" data-value="3" data-multi="true">★3</button>
          <button type="button" class="chip" data-value="4" data-disabled="true" title="P2 上线">★4</button>
          <button type="button" class="chip" data-value="5" data-disabled="true" title="P2 上线">★5</button>
        </div>
      </div>

      <div class="field">
        <div class="field-label" data-shell="cnCurve">难度曲线</div>
        <div class="chips">
          <button type="button" class="chip" data-key="curve" data-value="asc" data-shell="cnCurveAsc">递增</button>
          <button type="button" class="chip" data-key="curve" data-value="even" data-shell="cnCurveEven">均衡</button>
          <button type="button" class="chip" data-key="curve" data-value="mixed" data-shell="cnCurveMixed">混合</button>
        </div>
      </div>

      <div class="field">
        <div class="field-head">
          <span class="label-tip">
            <span class="field-label" data-shell="cnSeed">种子</span>
            <span class="tip" tabindex="0" aria-describedby="cnSeedTip">
              <span aria-hidden="true">?</span>
              <span class="tip-body" id="cnSeedTip" role="tooltip" data-shell="cnSeedTip">同一个种子配合同一组参数，每次生成的题目与顺序完全相同；复制种子即可复现整张卷子。</span>
            </span>
          </span>
        </div>
        <div class="row">
          <input type="text" id="seedInput" value="20261029" aria-label="随机种子">
          <button type="button" class="link-btn" id="seedRandom" data-shell="cnSeedRandom">换一个</button>
          <button type="button" class="link-btn" id="seedCopy" data-shell="cnSeedCopy">复制</button>
        </div>
      </div>

      <div class="group-title" data-shell="cnGroupLayout">排版与显示</div>

      <div class="prow">
        <div class="field">
          <div class="field-label" data-shell="cnCols">每行题数</div>
          <div class="chips">
            <button type="button" class="chip" data-key="cols" data-value="1">1</button>
            <button type="button" class="chip" data-key="cols" data-value="2">2</button>
            <button type="button" class="chip" data-key="cols" data-value="3">3</button>
          </div>
        </div>
        <div class="field">
          <div class="field-label" data-shell="cnRows">每页行数</div>
          <div class="chips">
            <button type="button" class="chip" data-key="rows" data-value="6">6</button>
            <button type="button" class="chip" data-key="rows" data-value="8">8</button>
            <button type="button" class="chip" data-key="rows" data-value="10">10</button>
            <button type="button" class="chip" data-key="rows" data-value="12">12</button>
          </div>
        </div>
      </div>

      <div class="prow">
        <div class="field">
          <div class="field-label" data-shell="cnFont">字号</div>
          <div class="chips">
            <button type="button" class="chip" data-key="fontSize" data-value="14">14</button>
            <button type="button" class="chip" data-key="fontSize" data-value="16">16</button>
            <button type="button" class="chip" data-key="fontSize" data-value="18">18</button>
          </div>
        </div>
        <div class="field">
          <div class="field-label" data-shell="cnHeader">表头</div>
          <div class="chips">
            <button type="button" class="chip" data-key="header" data-value="true" data-shell="cnOn">显示</button>
            <button type="button" class="chip" data-key="header" data-value="false" data-shell="cnOff">隐藏</button>
          </div>
        </div>
      </div>

      <div class="field">
        <div class="field-label" data-shell="cnAnswers">答案卷</div>
        <div class="chips">
          <button type="button" class="chip" data-key="answers" data-value="true" data-shell="cnOn">显示</button>
          <button type="button" class="chip" data-key="answers" data-value="false" data-shell="cnOff">隐藏</button>
        </div>
      </div>
    </div>

    <div class="panel-foot">
      <div class="status" id="status"></div>
