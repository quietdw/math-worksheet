  #paper{

  .page{
    width:794px;

    grid-auto-rows:minmax(0,1fr);
    column-gap:10px;
    min-height:0;

  .q{
    display:flex;
    align-items:center;
    min-width:0;

    font-size:var(--qfs);

  .q .blank{
    display:inline-block;

    min-width:2.2em;
    margin-left:6px;

    height:1em;

    margin-left:6px;

  .page-foot{

  .empty{

    padding:0 40px;

    font-size:14px;

    padding:2px 4px;

  .panel-scroll{padding:0 14px 6px}
  .group-title{

    align-items:center;

    padding:2px 0 5px;
    font-size:11px;

    color:#9aa1ad;

  .field{padding:6px 0;border-bottom:1px dashed var(--line-soft)}

  .chips[data-key="op"]{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
  .chips[data-key="op"] .chip{padding:4px 4px;text-align:center;white-space:nowrap}
  .chip{
    appearance:none;
    border:1px solid var(--line-strong);
    background:var(--surface);
    color:var(--text);
    font:inherit;
    font-size:12.5px;
    line-height:1.25;
    padding:4px 9px;
    border-radius:4px;
    cursor:pointer;
    transition:background .12s,border-color .12s,color .12s;
  }
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .chip.active{
    background:var(--accent-soft);
    border-color:var(--accent);
    color:var(--accent);
    font-weight:600;
  }
  .chip.mini{font-size:11.5px;line-height:1.2;padding:2px 7px;color:var(--muted)}
  .chip.mini.active{color:var(--accent)}
  .row{display:flex;align-items:center;gap:6px}
  .row .dash{flex:0 0 auto;color:var(--muted);font-size:12px}
  input[type=number]{
    width:100%;
    min-width:0;
    padding:4px 7px;
    font:inherit;
    font-size:12.5px;
    color:var(--text);
    border:1px solid var(--line-strong);
    border-radius:4px;
    background:var(--surface);
  }
  input[type=number]:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  #seedInput{
    flex:1 1 auto;
    width:auto;
    min-width:0;
    padding:4px 7px;
    font:inherit;
    font-family:Consolas,Monaco,monospace;
    font-size:12.5px;
    color:var(--text);
    border:1px solid var(--line-strong);
    border-radius:4px;
    background:var(--surface);
  }
  #seedInput:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  .row .link-btn{flex:0 0 auto;white-space:nowrap}
  .hint{
    margin:5px 0 0;
    font-size:11.5px;
    line-height:1.45;
    color:var(--muted);
  }

  .panel-foot{
    border-top:1px solid var(--line);
    padding:9px 14px;
    background:var(--surface-2);
  }
  .status{font-size:11.5px;color:var(--muted);margin-bottom:7px;min-height:16px}
  .status.warn{color:var(--warn)}
  .actions{display:flex;gap:8px}
  .btn{
    flex:1;
    appearance:none;
    font:inherit;
    font-size:13.5px;
    padding:8px 10px;
    border-radius:4px;
    border:1px solid var(--line-strong);
    background:var(--surface);
    color:var(--text);
    cursor:pointer;
    transition:background .12s,border-color .12s,color .12s;
  }
  .btn:hover{border-color:#9aa1ad}
  .btn:active{transform:translateY(1px)}
  .btn.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    font-weight:600;
  }
  .btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
  .btn.primary:disabled{opacity:.6;cursor:progress}

  .export-wrap{position:relative;flex:1;display:flex}
  .export-wrap .btn{flex:1}
  .export-wrap .btn::after{content:" ▾";font-size:11px;opacity:.75}
  .menu{
    position:absolute;
    right:0;
    bottom:calc(100% + 6px);
    min-width:196px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:6px;
    box-shadow:0 8px 24px rgba(16,24,40,.14);

  }
  .menu button{
    display:block;
    width:100%;
    text-align:left;
    appearance:none;

    font:inherit;
    font-size:13px;

  .menu button:hover{background:var(--hover)}
  .menu .sep{height:1px;background:var(--line-soft);margin:4px 2px}

  /* ---------------- 工具函数 ---------------- */

  function clone(obj) {
    var out = {};
    for (var k in obj) {
      if (Object.prototype.hasOwnProperty.call(obj, k)) out[k] = obj[k];
    }
    return out;
  }

  function hashSeed(str) {
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  // mulberry32：同一种子得到同一串随机数，用于复现整张卷子
  function makeRng(seed) {
    var a = hashSeed(String(seed == null ? '' : seed));
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function randomSeed() {
    return String(Math.floor(Math.random() * 900000) + 100000);
  }

  function rndInt(a, b) {
    return a + Math.floor(rand() * (b - a + 1));
  }

  function roundTo(v, d) {
    var p = Math.pow(10, d);
    return Math.round(v * p) / p;
  }

  function clampCount(v) {
    var n = Math.round(Number(v));
    if (!isFinite(n)) n = DEFAULTS.count;
    return Math.max(1, Math.min(2000, n));
  }

  function isFractional(v) {
    return Math.abs(v - Math.round(v)) > 1e-9;
  }

  function numBounds() {
    var a = Number(cfg.numMin);
    var b = Number(cfg.numMax);
    if (!isFinite(a)) a = 0;
    if (!isFinite(b)) b = 100;
    var lo = Math.min(a, b);
    var hi = Math.max(a, b);
    if (cfg.numType === 'int') {
      lo = Math.ceil(lo);
      hi = Math.floor(hi);
    }
    if (cfg.noNeg) lo = Math.max(lo, 0);
    if (hi < lo) hi = lo;
    return { lo: lo, hi: hi };
  }

  function randNum(lo, hi) {
    if (cfg.numType === 'int') return rndInt(Math.ceil(lo), Math.floor(hi));
    return roundTo(lo + rand() * (hi - lo), cfg.dp);
  }

  function fmtNum(v) {
    var dp = cfg.numType === 'int' ? 0 : cfg.dp;
    var s = roundTo(v, dp).toFixed(dp);
    if (dp > 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
    return s;
  }

  function fmtAnswer(v) {
    var s = roundTo(v, 6).toFixed(6).replace(/0+$/, '').replace(/\.$/, '');
    return s === '-0' || s === '' ? '0' : s;
  }

  /* ---------------- 出题引擎 ---------------- */

  function divisionCandidates(term, lo, hi) {
    var key = cfg.numType + '|' + cfg.dp + '|' + lo + '|' + hi + '|' + roundTo(term, 6);
    var cached = divCache.get(key);
    if (cached) return cached;

    var dp = cfg.numType === 'int' ? 0 : cfg.dp;
    var unit = Math.pow(10, -dp);
    var out = [];
    var T = Math.abs(term);
    if (!T) {
      divCache.set(key, out);
      return out;
    }

    var dMin = Math.max(1 + unit, lo);
    if (dMin > hi + 1e-9) {
      divCache.set(key, out);
      return out;
    }

    // 以整数商反推除数，保证除得尽，且不会出现 ÷1、÷自身这类无意义题
    var qLo = Math.max(2, Math.ceil(T / hi));
    var qHi = Math.min(Math.floor(T / dMin), Math.floor(T / Math.max(lo, unit)));
    qHi = Math.min(qHi, qLo + 4000);

    for (var q = qLo; q <= qHi; q++) {
      var d = T / q;
      var dr = roundTo(d, dp);
      if (Math.abs(d - dr) > 1e-9 * Math.max(1, d)) continue;
      if (dr < dMin - 1e-9 || dr > hi + 1e-9) continue;
      out.push(dr);
      if (out.length >= 20) break;
    }

    divCache.set(key, out);
    return out;
  }

  function filterUsedDivisors(list, used) {
    var out = [];
    for (var i = 0; i < list.length; i++) {
      var dup = false;
      for (var j = 0; j < used.length; j++) {
        if (Math.abs(list[i] - used[j]) < 1e-9) {
          dup = true;
          break;
        }
      }
      if (!dup) out.push(list[i]);
    }
    return out;
  }

  function pickFactor(lo, hi, fracTerm) {
    // 小数连乘时优先取整数因数，避免答案出现四五位小数
    if (cfg.numType === 'decimal' && fracTerm) {
      var iLo = Math.ceil(lo);
      var iHi = Math.floor(hi);
      if (iHi >= iLo) {
        if (iHi > iLo && iLo <= 1 && iHi >= 2) iLo = 2;
        return rndInt(iLo, iHi);
      }
    }
    var x = randNum(lo, hi);
    if (Math.abs(x - 1) < 1e-9 && hi > 1) x = randNum(lo, hi);
    return x;
  }

  function makeQuestion(seen) {
    var n = cfg.operands;
    var pool = OP_SETS[cfg.op] || OP_SETS.add;
    var bounds = numBounds();
    var lo = bounds.lo;
    var hi = bounds.hi;
    var unit = cfg.numType === 'int' ? 1 : Math.pow(10, -cfg.dp);
    var maxAbs = 1e9;

    for (var attempt = 0; attempt < 50; attempt++) {
      var nums = [randNum(lo, hi)];
      var ops = [];
      var term = nums[0];
      var termFactors = [nums[0]];
      var fracTerm = isFractional(term);
      var acc = 0;
      var ok = true;
      var i, k, op, options, cand, x;

      for (i = 0; i < n - 1; i++) {
        options = [];
        for (k = 0; k < pool.length; k++) {
          op = pool[k];
          if (op === '÷') {
            if (Math.abs(term) < Math.max(unit, 1)) continue;
            if (cfg.noNeg && term < 0) continue;
            if (!filterUsedDivisors(divisionCandidates(term, lo, hi), termFactors).length) continue;
          } else if (op === '×') {
            if (Math.abs(term) * Math.max(Math.abs(lo), Math.abs(hi), 1) > maxAbs) continue;
          } else if (op === '-' && cfg.noNeg) {
            if (acc + term < lo - 1e-9) continue;
          }
          options.push(op);
        }
        if (!options.length) {
          ok = false;
          break;
        }
        op = options[rndInt(0, options.length - 1)];

        if (op === '×') {
          x = pickFactor(lo, hi, fracTerm);
          if (Math.abs(term * x) > maxAbs) {
            ok = false;
            break;
          }
          term = roundTo(term * x, 10);
          termFactors.push(x);
          fracTerm = isFractional(term);
        } else if (op === '÷') {
          cand = filterUsedDivisors(divisionCandidates(term, lo, hi), termFactors);
          x = cand[rndInt(0, cand.length - 1)];
          term = roundTo(term / x, 10);
          termFactors.push(x);
          fracTerm = isFractional(term);
        } else {
          acc = roundTo(acc + term, 10);
          if (cfg.noNeg && acc < -1e-9) {
            ok = false;
            break;
          }
          if (op === '+') {
            x = randNum(lo, hi);
          } else if (cfg.noNeg) {
            var cap = Math.min(hi, acc);
            if (cap < lo - 1e-9) {
              ok = false;
              break;
            }
            x = randNum(lo, Math.max(lo, cap));
          } else {
            x = randNum(lo, hi);
          }
          term = op === '-' ? -x : x;
          termFactors = [x];
          fracTerm = isFractional(term);
        }

        ops.push(op);
        nums.push(x);
      }

      if (!ok) continue;

      var value = roundTo(acc + term, 10);
      if (!isFinite(value) || Math.abs(value) > 1e12) continue;
      if (cfg.noNeg && value < -1e-9) continue;
      if (cfg.resMin !== null && value < cfg.resMin - 1e-9) continue;
      if (cfg.resMax !== null && value > cfg.resMax + 1e-9) continue;

      var expr = '';
      for (i = 0; i < nums.length; i++) {
        if (i) expr += ' ' + ops[i - 1] + ' ';
        var token = fmtNum(nums[i]);
        expr += (i > 0 && token.charAt(0) === '-') ? '(' + token + ')' : token;
      }
      if (seen && seen.has(expr)) continue;
      return { expr: expr, value: value };
    }

    return null;
  }

  function generate() {
    var total = clampCount(cfg.count);
    var seen = new Set();
    var list = [];
    var misses = 0;

    rand = makeRng(cfg.seed);
    divCache.clear();

    while (list.length < total) {
      var q = makeQuestion(seen);
      if (!q) {
        misses++;
        if (misses > 40) {
          if (seen.size) {
            seen.clear();
            misses = 0;
            continue;
          }
          break;
        }
        continue;
      }
      misses = 0;
      list.push(q);
      seen.add(q.expr);
    }

    questions = list;
    render();
  }

  /* ---------------- 预览渲染 ---------------- */

  function buildHeadHtml() {
    return '<div class="page-head">' + headLabels().map(function (name) {
      return '<span class="head-item"><span>' + escapeHtml(name + headColon()) +
        '</span><i class="head-blank"></i></span>';
    }).join('') + '</div>';
  }

  function buildPage(qs, index, count) {
    var html = '<section class="page">';

    if (cfg.header) html += buildHeadHtml();

    if (!qs.length) {
      html += '<div class="empty">' + escapeHtml(t('emptyState')) + '</div>';
    } else {
      html += '<div class="grid">';
      for (var r = 0; r < cfg.rows; r++) {
        for (var c = 0; c < cfg.cols; c++) {
          var q = qs[r * cfg.cols + c];
          html += '<div class="q">';
          if (q) {
            html += '<span class="expr">' + escapeHtml(q.expr + ' =') + '</span>';
            html += cfg.answers
              ? '<span class="ans">' + escapeHtml(fmtAnswer(q.value)) + '</span>'
              : '<span class="blank"></span>';
          }
          html += '</div>';
        }
      }
      html += '</div>';
    }

    html += '<div class="page-foot">' + escapeHtml(tf('pageOf', { i: index + 1, n: count })) + '</div></section>';
    return html;
  }

  function fitFontSize() {
    var ratio = 1;
    paperEl.find('.q').each(function () {
      var cell = this;
      if (!cell.firstChild) return;
      var avail = cell.clientWidth;
      if (!avail) return;
      if (cell.scrollWidth > avail + 0.5) {
        ratio = Math.min(ratio, avail / cell.scrollWidth);
      }
    });
    var size = cfg.fontSize;
    if (ratio < 1) {
      size = Math.max(10, Math.floor(cfg.fontSize * ratio * 0.97));
    }
    effectiveFontSize = size;
    setCssVar(paperEl, '--qfs', size + 'px');
    return size < cfg.fontSize;
  }

  function render() {
    var scrollTop = previewEl.scrollTop();
    var perPage = Math.max(1, cfg.cols * cfg.rows);
    var pages = [];
    var i;

    for (i = 0; i < questions.length; i += perPage) {
      pages.push(questions.slice(i, i + perPage));
    }
    if (!pages.length) pages.push([]);

    setCssVar(paperEl, '--cols', cfg.cols);
    setCssVar(paperEl, '--qfs', cfg.fontSize + 'px');

    paperEl.html(pages.map(function (qs, index) {
      return buildPage(qs, index, pages.length);
    }).join(''));

    var shrunk = fitFontSize();
    updateStatus(shrunk);
    previewEl.scrollTop(scrollTop);
    applyZoom();
  }

  function updateStatus(shrunk) {
    var perPage = Math.max(1, cfg.cols * cfg.rows);

    if (!questions.length) {
      statusEl.text(t('statusEmpty')).addClass('warn');
      return;
    }

    var pageCount = Math.max(1, Math.ceil(questions.length / perPage));
    var shownPerPage = Math.min(perPage, questions.length);
    var warns = [];

    if (questions.length < clampCount(cfg.count)) warns.push(t('warnPartial'));
    if (shrunk) warns.push(t('warnFont'));
    if (cfg.resMin !== null && cfg.resMax !== null && cfg.resMin > cfg.resMax) {
      warns.push(t('warnRange'));
    }

    var text = statusText(questions.length, shownPerPage, pageCount);
    statusEl.text(text + (warns.length ? ' · ' + warns.join(' · ') : ''))
      .toggleClass('warn', warns.length > 0);
  }

  /* ---------------- 缩放 ---------------- */

  function applyZoom() {
    if (view.mode === 'fit') {
      var avail = paperEl.parent()[0].clientWidth;
      view.zoom = Math.max(0.3, Math.min(1, avail / PAGE_W));
    }
    setCssVar(paperEl, '--zoom', String(view.zoom));
    zoomVal.text(Math.round(view.zoom * 100) + '%')
      .attr('title', t(view.mode === 'fit' ? 'zoomValFit' : 'zoomValManual'));
  }

  function setZoom(next, mode) {
    view.mode = mode || 'manual';
    view.zoom = Math.max(0.3, Math.min(2, Math.round(next * 100) / 100));
    applyZoom();
  }

  /* ---------------- 配置保存 ---------------- */

  function saveCfg() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify(cfg));
      } catch (e) { /* 隐私模式下忽略 */ }
    }, 300);
  }

  function loadCfg() {
    var raw;
    try {
      raw = localStorage.getItem(STORE_KEY);
    } catch (e) {
      return;
    }
    if (!raw) return;
    var saved;
    try {
      saved = JSON.parse(raw);
    } catch (e) {
      return;
    }
    if (!saved || typeof saved !== 'object') return;

    for (var key in DEFAULTS) {
      if (!Object.prototype.hasOwnProperty.call(saved, key)) continue;
      var val = saved[key];
      if (key === 'numMin' || key === 'numMax' || key === 'count' ||
          key === 'cols' || key === 'rows' || key === 'fontSize' ||
          key === 'operands' || key === 'dp') {
        val = Number(val);
        if (!isFinite(val)) continue;
      }
      cfg[key] = val;
    }

    if (!OP_SETS[cfg.op]) cfg.op = DEFAULTS.op;
    if (cfg.numType !== 'decimal') cfg.numType = 'int';
    cfg.operands = Math.max(2, Math.min(4, cfg.operands || 2));
    cfg.dp = cfg.dp === 1 ? 1 : 2;
    cfg.cols = Math.max(1, Math.min(8, cfg.cols || 4));
    cfg.rows = Math.max(1, Math.min(50, cfg.rows || 25));
    cfg.fontSize = Math.max(10, Math.min(32, cfg.fontSize || 16));
    cfg.count = clampCount(cfg.count);
    cfg.noNeg = cfg.noNeg !== false;
    cfg.header = cfg.header !== false;
    cfg.answers = cfg.answers === true;
    cfg.resMin = cfg.resMin === null || cfg.resMin === undefined || cfg.resMin === '' ? null : Number(cfg.resMin);
    cfg.resMax = cfg.resMax === null || cfg.resMax === undefined || cfg.resMax === '' ? null : Number(cfg.resMax);
    if (cfg.resMin !== null && !isFinite(cfg.resMin)) cfg.resMin = null;
    if (cfg.resMax !== null && !isFinite(cfg.resMax)) cfg.resMax = null;
    cfg.seed = String(cfg.seed == null ? '' : cfg.seed).trim().slice(0, 32);
    if (!cfg.seed) cfg.seed = randomSeed();
  }

  /* ---------------- 参数与界面同步 ---------------- */

  function setCfg(key, value, immediate) {
    cfg[key] = value;
    saveCfg();

    if (key === 'numType') {
      syncDpField();
      syncRangeStep();
    }
    syncChips(key);
    syncPresets();

    if (LAYOUT_KEYS[key]) {
      render();
    } else if (immediate) {
      clearTimeout(genTimer);
      generate();
    } else {
      scheduleGenerate();
    }
  }

  function scheduleGenerate(delay) {
    clearTimeout(genTimer);
    genTimer = setTimeout(generate, delay === undefined ? 260 : delay);
  }

  function syncChips(key) {
    $('.chips[data-key="' + key + '"]').each(function () {
      var box = $(this);
      var type = box.attr('data-type');
      box.find('.chip').each(function () {
        var chip = $(this);
        var raw = chip.attr('data-value');
        var val = type === 'bool' ? raw === 'true'
          : (typeof cfg[key] === 'string' ? raw : Number(raw));
        chip.toggleClass('active', val === cfg[key]);
      });
    });
  }

  function syncAllChips() {
    for (var key in DEFAULTS) syncChips(key);
    $('input[data-key]').each(function () {
      var input = $(this);
      var val = cfg[input.attr('data-key')];
      input.val(val === null ? '' : String(val));
    });
    seedInput.val(cfg.seed);
    syncDpField();
    syncRangeStep();
    syncPresets();
  }

  function syncDpField() {
    var isDecimal = cfg.numType === 'decimal';
    dpField.prop('hidden', !isDecimal);
    var prow = dpField.parent();
    if (prow.hasClass('prow')) prow.toggleClass('single', !isDecimal);
  }

  function syncRangeStep() {
    var step = cfg.numType === 'decimal' ? '0.01' : '1';
    $('input[data-key="numMin"], input[data-key="numMax"]').prop('step', step);
  }

  function syncPresets() {
    var lo = Math.min(Number(cfg.numMin), Number(cfg.numMax));
    var hi = Math.max(Number(cfg.numMin), Number(cfg.numMax));
    rangePresets.find('.chip').each(function () {
      var chip = $(this);
      chip.toggleClass('active',
        Number(chip.attr('data-min')) === lo && Number(chip.attr('data-max')) === hi);
    });
    countPresets.find('.chip').each(function () {
      var chip = $(this);
      chip.toggleClass('active', Number(chip.attr('data-count')) === Number(cfg.count));
    });
  }

  /* ---------------- 事件绑定 ---------------- */

  $('.chips[data-key]').on('click', function (e) {
    var chip = $(e.target).closest('.chip');
    if (!chip.length) return;
    var box = $(this);
    var key = box.attr('data-key');
    var raw = chip.attr('data-value');
    var value = box.attr('data-type') === 'bool' ? raw === 'true'
      : (typeof cfg[key] === 'string' ? raw : Number(raw));
    if (value === cfg[key]) return;
    setCfg(key, value, true);
  });

  rangePresets.on('click', function (e) {
    var chip = $(e.target).closest('.chip');
    if (!chip.length) return;
    cfg.numMin = Number(chip.attr('data-min'));
    cfg.numMax = Number(chip.attr('data-max'));
    saveCfg();
    $('input[data-key="numMin"], input[data-key="numMax"]').each(function () {
      var input = $(this);
      input.val(String(cfg[input.attr('data-key')]));
    });
    syncPresets();
    clearTimeout(genTimer);
    generate();
  });

  countPresets.on('click', function (e) {
    var chip = $(e.target).closest('.chip');
    if (!chip.length) return;
    cfg.count = Number(chip.attr('data-count'));
    saveCfg();
    $('input[data-key="count"]').val(String(cfg.count));
    syncPresets();
    clearTimeout(genTimer);
    generate();
  });

  seedInput.on('input', function () {
    var next = seedInput.val().trim();
    cfg.seed = next;
    saveCfg();
    if (next) scheduleGenerate(360);
  });

  seedInput.on('blur', function () {
    if (cfg.seed) return;
    cfg.seed = randomSeed();
    seedInput.val(cfg.seed);
    saveCfg();
    clearTimeout(genTimer);
    generate();
  });

  seedInput.on('keydown', function (e) {
    if (e.key !== 'Enter') return;
    seedInput[0].blur();
    clearTimeout(genTimer);
    generate();
  });

  $('#seedRandom').on('click', function () {
    cfg.seed = randomSeed();
    seedInput.val(cfg.seed);
    saveCfg();
    clearTimeout(genTimer);
    generate();
  });

  $('#seedCopy').on('click', function () {
    var done = function (ok) {
      statusEl.text(t(ok ? 'seedCopied' : 'seedFail')).toggleClass('warn', !ok);
    };
    if (window.navigator.clipboard && window.navigator.clipboard.writeText) {
      window.navigator.clipboard.writeText(cfg.seed).then(function () {
        done(true);
      }, function () {
        done(false);
      });
    } else {
      seedInput[0].select();
      done(false);
    }
  });

  $('input[data-key]').each(function () {
    var input = $(this);
    var key = input.attr('data-key');

    input.on('input', function () {
      var raw = input.val().trim();
      var value;

      if (key === 'resMin' || key === 'resMax') {
        value = raw === '' ? null : Number(raw);
        if (value !== null && !isFinite(value)) return;
      } else {
        if (raw === '' || raw === '-' || raw === '.') return;
        value = Number(raw);
        if (!isFinite(value)) return;
        if (key === 'count') value = clampCount(value);
      }

      cfg[key] = value;
      saveCfg();
      syncPresets();
      scheduleGenerate(360);
    });

    input.on('blur', function () {
      if (key === 'resMin' || key === 'resMax') {
        input.val(cfg[key] === null ? '' : String(cfg[key]));
        return;
      }
      if (key === 'count') cfg.count = clampCount(input.val());
      if (input.val().trim() === '' || !isFinite(Number(input.val()))) {
        input.val(String(cfg[key]));
      } else if (key === 'count') {
        input.val(String(cfg.count));
      }
      syncPresets();
    });

    input.on('keydown', function (e) {
      if (e.key === 'Enter') {
        input[0].blur();
        generate();
      }
    });
  });

  regenBtn.on('click', function () {
    clearTimeout(genTimer);
    // 「换一批」换的是种子，否则同种子会生成同一份卷子
    cfg.seed = randomSeed();
    seedInput.val(cfg.seed);
    saveCfg();
    generate();
  });

  $('#resetBtn').on('click', function () {
    cfg = clone(DEFAULTS);
    cfg.seed = randomSeed();
    saveCfg();
    syncAllChips();
    clearTimeout(genTimer);
    generate();
  });

  // 界面语言由站点外壳（assets/site-shell.js）统一控制，这里只跟随切换结果
  $(document).on('site:lang', function (e) {
    var next = e.detail && e.detail.lang;
    if (next && next !== lang) applyLang(next);
  });

  $('#zoomIn').on('click', function () {
    setZoom(view.zoom + 0.1);
  });

  $('#zoomOut').on('click', function () {
    setZoom(view.zoom - 0.1);
  });

  $('#zoomFit').on('click', function () {
    view.mode = 'fit';
    applyZoom();
  });

  zoomVal.on('click', function () {
    setZoom(1, 'manual');
  });

  previewEl.on('wheel', function (e) {
    if (!e.ctrlKey) return;
    e.preventDefault();
    setZoom(view.zoom + (e.deltaY < 0 ? 0.05 : -0.05));
  });

  var resizeTimer = null;
  $(window).on('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      if (view.mode === 'fit') applyZoom();
    }, 120);
  });

  // 首屏布局、字体加载或面板宽度变化后重新计算“适应宽度”
  if (window.ResizeObserver) {
    new ResizeObserver(function () {
      if (view.mode === 'fit') applyZoom();
    }).observe(previewEl[0]);
  }
  $(window).on('load', function () {
    if (view.mode === 'fit') applyZoom();
  });
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () {
      if (view.mode === 'fit') applyZoom();
    });
  }

  /* ---------------- 导出 ---------------- */

  exportBtn.on('click', function (e) {
    e.stopPropagation();
    exportMenu.prop('hidden', !exportMenu.prop('hidden'));
  });

  $(document).on('click', function () {
    exportMenu.prop('hidden', true);
  });

  exportMenu.on('click', function (e) {
    var item = $(e.target).closest('button[data-act]');
    if (!item.length) return;
    exportMenu.prop('hidden', true);
    var act = item.attr('data-act');

    if (act === 'print') {
      window.print();
      return;
    }
    if (!questions.length) {
      alert(t('noQuestions'));
      return;
    }
    if (act === 'html') {
      downloadHtml(false);
      return;
    }
    exportDocx(act === 'docx-answers');
  });

  function saveBlob(blob, filename) {
    var url = URL.createObjectURL(blob);
    var link = $('<a>').attr({ href: url, download: filename }).appendTo(document.body);
    link[0].click();
    link.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  function chunkQuestions(perPage) {
    var pages = [];
    for (var i = 0; i < questions.length; i += perPage) {
      pages.push(questions.slice(i, i + perPage));
    }
    return pages;
  }

  function fitDocFont(blankLen, cellWidthMm) {
    var canvas = fitDocFont.canvas;
    if (!canvas) {
      canvas = $('<canvas>')[0];
      fitDocFont.canvas = canvas;
    }
    var ctx = canvas.getContext('2d');
    var avail = cellWidthMm * 96 / 25.4;
    var size = effectiveFontSize;
    for (var pass = 0; pass < 8; pass++) {
      ctx.font = size + 'px "' + FONT_STACK + '"';
      var maxW = 0;
      for (var i = 0; i < questions.length; i++) {
        var w = ctx.measureText(questions[i].expr + ' = ' + '_'.repeat(blankLen)).width;
        if (w > maxW) maxW = w;
      }
      if (maxW <= avail * 0.92 || size <= 10) break;
      size = Math.max(10, Math.floor(size * avail * 0.92 / maxW));
    }
    return size;
  }

  function chooseExportMetrics(cellWidthMm) {
    var best = { len: 4, size: 10 };
    for (var len = 7; len >= 4; len--) {
      var size = fitDocFont(len, cellWidthMm);
      if (size > best.size || (size === best.size && len > best.len)) {
        best = { len: len, size: size };
      }
      if (size >= effectiveFontSize) {
        return { len: len, size: size };
      }
    }
    return best;
  }

  var docxLoader = null;

  function loadDocx() {
    if (window.docx) return Promise.resolve(window.docx);
    if (docxLoader) return docxLoader;

    docxLoader = new Promise(function (resolve) {
      var settled = false;
      function finish(lib) {
        if (settled) return;
        settled = true;
        resolve(lib || null);
      }
      $('<script>')
        .attr({ src: 'https://unpkg.com/docx@7.8.2/build/index.js', async: true })
        .on('load', function () { finish(window.docx); })
        .on('error', function () { finish(null); })
        .appendTo(document.head);
      setTimeout(function () { finish(window.docx); }, 8000);
    });

    return docxLoader;
  }

  function exportDocx(withAnswers) {
    if (window.docx) {
      buildDocx(window.docx, withAnswers);
      return;
    }

    regenBtn.prop('disabled', true);
    loadDocx().then(function (lib) {
      regenBtn.prop('disabled', false);
      if (lib) buildDocx(lib, withAnswers);
      else downloadHtml(withAnswers);
    });
  }

  function buildDocx(d, withAnswers) {
    var mm = function (v) { return Math.round(v * 56.692913); };
    var perPage = Math.max(1, cfg.cols * cfg.rows);
    var pages = chunkQuestions(perPage);
    var metrics = chooseExportMetrics((210 - 30) / cfg.cols - 2);
    var blankLen = metrics.len;
    var halfPt = Math.round(metrics.size * 0.75 * 2);
    var marginTop = 20;
    var marginBottom = 18;
    var marginSide = 15;
    var contentMm = 297 - marginTop - marginBottom;
    var headerMm = cfg.header ? 12 : 0;
    var footerMm = 9;
    var rowTwip = Math.round(mm((contentMm - headerMm - footerMm) / cfg.rows));
    var cellWidth = 100 / cfg.cols;
    var borderNone = { style: d.BorderStyle.NONE, size: 0, color: 'FFFFFF' };
    var borders = {
      top: borderNone, bottom: borderNone, left: borderNone, right: borderNone,
      insideHorizontal: borderNone, insideVertical: borderNone
    };

    function headTable() {
      var labels = headLabels();
      var cells = labels.map(function (name) {
        return new d.TableCell({
          children: [new d.Paragraph({
            children: [
              new d.TextRun({ text: name + headColon(), size: 21, font: FONT_STACK }),
              new d.TextRun({
                text: '\u00A0'.repeat(lang === 'zh' ? 14 : 12),
                size: 21,
                font: FONT_STACK,
                underline: { type: d.UnderlineType.SINGLE }
              })
            ],
            spacing: { before: 0, after: 0 }
          })],
          width: { size: 25, type: d.WidthType.PERCENTAGE },
          margins: { top: 0, bottom: 0, left: 0, right: 80 },
          borders: borders
        });
      });
      return new d.Table({
        width: { size: 100, type: d.WidthType.PERCENTAGE },
        borders: borders,
        rows: [new d.TableRow({ children: cells })]
      });
    }

    function questionTable(qs) {
      var rows = [];
      for (var r = 0; r < cfg.rows; r++) {
        var cells = [];
        for (var c = 0; c < cfg.cols; c++) {
          var q = qs[r * cfg.cols + c];
          var runs = [];
          if (q) {
            runs.push(new d.TextRun({ text: q.expr + ' =', size: halfPt, font: FONT_STACK }));
            if (withAnswers) {
              runs.push(new d.TextRun({
                text: ' ' + fmtAnswer(q.value),
                size: halfPt,
                font: FONT_STACK,
                color: '1D4ED8',
                bold: true
              }));
            } else {
              runs.push(new d.TextRun({ text: ' ' + '_'.repeat(blankLen), size: halfPt, font: FONT_STACK }));
            }
          }
          cells.push(new d.TableCell({
            children: [new d.Paragraph({
              children: runs,
              spacing: { before: 0, after: 0, line: rowTwip, lineRule: 'exact' }
            })],
            width: { size: cellWidth, type: d.WidthType.PERCENTAGE },
            verticalAlign: d.VerticalAlign.CENTER,
            margins: { top: 0, bottom: 0, left: 70, right: 20 },
            borders: borders
          }));
        }
        rows.push(new d.TableRow({
          children: cells,
          height: { value: rowTwip, rule: d.HeightRule.EXACT },
          cantSplit: true
        }));
      }
      return new d.Table({
        width: { size: 100, type: d.WidthType.PERCENTAGE },
        layout: d.TableLayoutType.FIXED,
        borders: borders,
        rows: rows
      });
    }

    function footer() {
      return new d.Footer({
        children: [new d.Paragraph({
          alignment: d.AlignmentType.CENTER,
          children: [new d.TextRun({
            children: [t('footerPrefix'), d.PageNumber.CURRENT, t('footerMid'), d.PageNumber.TOTAL_PAGES, t('footerSuffix')],
            size: 18,
            font: FONT_STACK,
            color: '808080'
          })]
        })]
      });
    }

    var sections = pages.map(function (qs) {
      var children = [];
      if (cfg.header) {
        children.push(headTable());
        children.push(new d.Paragraph({
          children: [],
          spacing: { before: 160, after: 0, line: 60, lineRule: 'exact' }
        }));
      }
      children.push(questionTable(qs));
      return {
        properties: {
          page: {
            size: { width: mm(210), height: mm(297) },
            margin: {
              top: mm(marginTop),
              right: mm(marginSide),
              bottom: mm(marginBottom),
              left: mm(marginSide),
              header: 0,
              footer: mm(6)
            }
          }
        },
        footers: { default: footer() },
        children: children
      };
    });

    var doc = new d.Document({ sections: sections });
    regenBtn.prop('disabled', true);

    d.Packer.toBlob(doc).then(function (blob) {
      var name = tf(withAnswers ? 'fileNameAnswers' : 'fileNameWorksheet', { n: questions.length });
      saveBlob(blob, name + '.docx');
    }).catch(function (err) {
      console.error(err);
      alert(t('docxFail'));
      downloadHtml(withAnswers);
    }).then(function () {
      regenBtn.prop('disabled', false);
    });
  }

  function buildStandaloneHtml(withAnswers) {
    var perPage = Math.max(1, cfg.cols * cfg.rows);
    var pages = chunkQuestions(perPage);
    var pt = (effectiveFontSize * 0.75).toFixed(2);
    var colon = lang === 'zh' ? '：' : ': ';
    var headHtml = cfg.header
      ? '<div class="head">' + headLabels().map(function (name) {
        return '<span class="head-cell">' + escapeHtml(name) + colon + '</span>';
      }).join('') + '</div>'
      : '';

    var body = pages.map(function (qs, pageIndex) {
      var rows = '';
      for (var r = 0; r < cfg.rows; r++) {
        rows += '<tr>';
        for (var c = 0; c < cfg.cols; c++) {
          var q = qs[r * cfg.cols + c];
          var content = '';
          if (q) {
            content = escapeHtml(q.expr) + ' =';
            content += withAnswers
              ? '<span class="ans"> ' + fmtAnswer(q.value) + '</span>'
              : '<span class="blank"></span>';
          }
          rows += '<td>' + content + '</td>';
        }
        rows += '</tr>';
      }
      return '<div class="sheet">' + headHtml + '<table>' + rows + '</table>' +
        '<div class="foot">' + escapeHtml(tf('htmlPage', { i: pageIndex + 1 })) + '</div></div>';
    }).join('');

    return '<!DOCTYPE html><html lang="' + (lang === 'zh' ? 'zh-CN' : 'en') + '"><head><meta charset="utf-8">' +
      '<title>' + escapeHtml(t('exportTitle')) + '</title><style>' +
      '@page{size:A4;margin:15mm}' +
      'body{margin:0;font-family:"Microsoft YaHei","Segoe UI",sans-serif;color:#111}' +
      '.sheet{width:180mm;min-height:250mm;page-break-after:always;display:flex;flex-direction:column}' +
      '.sheet:last-child{page-break-after:auto}' +
      '.head{display:flex;margin-bottom:6mm;font-size:10.5pt}' +
      '.head-cell{flex:1;border-bottom:1px solid #555;margin-right:6mm;padding-bottom:1mm}' +
      '.head-cell:last-child{margin-right:0}' +
      'table{width:100%;border-collapse:collapse;table-layout:fixed;flex:1}' +
      'td{font-size:' + pt + 'pt;padding:0;white-space:nowrap}' +
      '.blank{display:inline-block;width:16mm;border-bottom:1px solid #333;margin-left:1mm}' +
      '.ans{color:#1d4ed8;font-weight:700}' +
      '.foot{text-align:center;font-size:8pt;color:#888;padding-top:3mm}' +
      '</style></head><body>' + body + DOC_END;
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"]/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch];
    });
  }

  function downloadHtml(withAnswers) {
    if (!questions.length) {
      alert(t('noQuestions'));
      return;
    }
    var html = buildStandaloneHtml(withAnswers);
    saveBlob(new Blob(['\ufeff' + html], { type: 'text/html;charset=utf-8' }),
      tf('fileNameHtml', { n: questions.length }) + '.html');
  }

  /* ---------------- 启动 ---------------- */

  loadCfg();
  if (!cfg.seed) cfg.seed = randomSeed();
  syncAllChips();
  applyLang(detectLang(), true);
  generate();

  if (/[?&]debug=1/.test(location.search)) {
    window.__app = {
      getCfg: function () { return clone(cfg); },
      setCfg: function (patch) {
        for (var k in patch) {
          if (Object.prototype.hasOwnProperty.call(patch, k)) cfg[k] = patch[k];
        }
        syncAllChips();
      },
      getQuestions: function () { return questions.slice(); },
      getLang: function () { return lang; },
      setLang: function (next) { applyLang(next); },
      t: t,
      generate: generate,
      render: render
    };
  }
})();
</script>
</body>
</html>
